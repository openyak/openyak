schema_version: 1
suite_version: runtime-v0
task_id: edit/batch-rollback-001
description: Preserve the original file when any batch replacement is invalid
execution_modes: [scripted]
prompt: Apply two edits atomically; if either edit is invalid, leave the file unchanged.
workspace_fixture: ../fixtures/edit-preserve
allowed_tools:
  - edit
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 1
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/config.txt
    - type: text_equals
      path: openyak_written/config.txt
      value: "status=inactive\nowner=alice\n"
    - type: no_unexpected_changes
      allowed: []
expected_events:
  - event: tool-error
    data_contains:
      tool: edit
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: invalid-batch-edit
            name: edit
            arguments:
              file_path: config.txt
              edits:
                - old_string: status=inactive
                  new_string: status=active
                - old_string: owner=charlie
                  new_string: owner=bob
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: The atomic edit failed and the file was not changed.
        - type: finish
          data:
            reason: stop
