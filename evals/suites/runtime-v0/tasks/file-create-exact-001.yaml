schema_version: 1
suite_version: runtime-v0
task_id: file/create-exact-001
description: Create a text file with exact content
execution_modes: [scripted, live]
prompt: |
  Create a file named result.txt containing exactly this line, including the
  final newline:
  OpenYak evaluation passed.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - write
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 3
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/result.txt
    - type: text_equals
      path: openyak_written/result.txt
      value: "OpenYak evaluation passed.\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/result.txt
scripted_provider:
  model_id: eval-scripted-model
  steps:
    - chunks:
        - type: tool-call
          data:
            id: write-result
            name: write
            arguments:
              file_path: result.txt
              content: "OpenYak evaluation passed.\n"
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Created the requested file.
        - type: finish
          data:
            reason: stop
