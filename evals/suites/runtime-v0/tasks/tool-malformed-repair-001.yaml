schema_version: 1
suite_version: runtime-v0
task_id: tool/malformed-repair-001
description: Normalize a malformed provider tool payload before execution
prompt: Create repaired.txt containing repaired.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - write
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/repaired.txt
    - type: text_equals
      path: openyak_written/repaired.txt
      value: "repaired\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/repaired.txt
expected_events:
  - event: tool-call
    data_contains:
      tool: write
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: malformed-write
            name: ""
            arguments:
              - function:
                  name: write
                  parameters:
                    file_path: repaired.txt
                    content: "repaired\n"
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Repaired and executed the tool call.
        - type: finish
          data:
            reason: stop
