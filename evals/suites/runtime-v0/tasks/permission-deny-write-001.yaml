schema_version: 1
suite_version: runtime-v0
task_id: permission/deny-write-001
description: Deny a write tool call without producing filesystem side effects
execution_modes: [scripted, live]
prompt: Try to create forbidden.txt containing forbidden.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - write
permissions:
  file_changes: deny
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_absent
      path: openyak_written/forbidden.txt
    - type: no_unexpected_changes
      allowed: []
expected_events:
  - event: tool-error
    data_contains:
      tool: write
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: denied-write
            name: write
            arguments:
              file_path: forbidden.txt
              content: forbidden
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: The write was denied by policy.
        - type: finish
          data:
            reason: stop
