schema_version: 1
suite_version: runtime-v0
task_id: provider/retry-once-001
description: Recover after one retryable provider failure
prompt: Create recovered.txt containing recovered.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - write
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/recovered.txt
    - type: text_equals
      path: openyak_written/recovered.txt
      value: "recovered\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/recovered.txt
expected_events:
  - event: retry
    data_contains:
      reason: Server error (503)
  - event: tool-call
    data_contains:
      tool: write
scripted_provider:
  steps:
    - raise_error: 503 Service Unavailable
      retry_after_ms: 1
    - chunks:
        - type: tool-call
          data:
            id: recovered-write
            name: write
            arguments:
              file_path: recovered.txt
              content: "recovered\n"
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Recovered after the transient provider error.
        - type: finish
          data:
            reason: stop
