schema_version: 1
suite_version: runtime-v0
task_id: code_execute/create-exact-001
description: Create an exact artifact through in-process Python execution
execution_modes: [scripted, live]
prompt: |
  Use code_execute to create code-output.txt in the OpenYak output directory.
  Its content must be exactly "created by code" followed by a newline. Do not
  create or modify any other file.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - code_execute
permissions:
  file_changes: deny
  run_commands: allow
budget:
  max_tool_calls: 1
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/code-output.txt
    - type: text_equals
      path: openyak_written/code-output.txt
      value: "created by code\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/code-output.txt
scripted_provider:
  model_id: eval-scripted-model
  steps:
    - chunks:
        - type: tool-call
          data:
            id: code-create-result
            name: code_execute
            arguments:
              code: |
                from pathlib import Path
                target = Path(OPENYAK_OUTPUT_DIR) / "code-output.txt"
                target.write_text("created by code\n", encoding="utf-8")
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Created the requested artifact.
        - type: finish
          data:
            reason: stop
