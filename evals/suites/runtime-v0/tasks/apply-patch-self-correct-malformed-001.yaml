schema_version: 1
suite_version: runtime-v0
task_id: apply-patch/self-correct-malformed-001
description: Recover after parser feedback rejects a malformed rename patch
execution_modes: [scripted]
prompt: Rename draft.md to final.md without changing its content.
workspace_fixture: ../fixtures/rename-preserve
allowed_tools:
  - apply_patch
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_absent
      path: openyak_written/draft.md
    - type: file_exists
      path: openyak_written/final.md
    - type: text_equals
      path: openyak_written/final.md
      value: "# Stable report\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/draft.md
        - openyak_written/final.md
expected_events:
  - event: tool-error
    data_contains:
      tool: apply_patch
  - event: tool-result
    data_contains:
      tool: apply_patch
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: malformed-move-patch
            name: apply_patch
            arguments:
              patch_text: |
                *** Begin Patch
                *** Move File: draft.md -> final.md
                *** End Patch
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: tool-call
          data:
            id: corrected-move-patch
            name: apply_patch
            arguments:
              patch_text: |
                *** Begin Patch
                *** Update File: draft.md
                *** Move to: final.md
                *** End Patch
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Corrected the patch syntax and renamed the file.
        - type: finish
          data:
            reason: stop
