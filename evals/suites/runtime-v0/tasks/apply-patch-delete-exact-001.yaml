schema_version: 1
suite_version: runtime-v0
task_id: apply-patch/delete-exact-001
description: Delete one requested file through apply_patch
execution_modes: [scripted, live]
prompt: Use apply_patch to delete draft.md and make no other workspace changes.
workspace_fixture: ../fixtures/rename-preserve
allowed_tools:
  - apply_patch
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 1
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_absent
      path: openyak_written/draft.md
    - type: no_unexpected_changes
      allowed:
        - openyak_written/draft.md
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: delete-file-patch
            name: apply_patch
            arguments:
              patch_text: |
                *** Begin Patch
                *** Delete File: draft.md
                *** End Patch
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Deleted the requested file.
        - type: finish
          data:
            reason: stop
