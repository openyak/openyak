schema_version: 1
suite_version: runtime-v0
task_id: bash/timeout-001
description: Stop a long-running command at its declared timeout
execution_modes: [scripted]
prompt: |
  Use the bash tool to run the requested long-running command with a one-second
  timeout. Report the timeout without creating or modifying any files.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - bash
permissions:
  file_changes: deny
  run_commands: allow
budget:
  max_tool_calls: 1
  timeout_seconds: 10
scorer:
  type: workspace
  assertions:
    - type: no_unexpected_changes
      allowed: []
expected_events:
  - event: tool-error
    data_contains:
      tool: bash
      error_category: timeout
      cwd_scope: default_output
scripted_provider:
  model_id: eval-scripted-model
  steps:
    - chunks:
        - type: tool-call
          data:
            id: bash-timeout-command
            name: bash
            arguments:
              command: sleep 2
              timeout: 1
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: The command timed out after one second.
        - type: finish
          data:
            reason: stop
