schema_version: 1
suite_version: runtime-v0
task_id: apply-patch/add-exact-001
description: Add one file with exact content through apply_patch
execution_modes: [scripted, live]
prompt: Use apply_patch to create added.txt containing exactly "added by patch" and a final newline.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - apply_patch
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 1
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/added.txt
    - type: text_equals
      path: openyak_written/added.txt
      value: "added by patch\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/added.txt
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: add-file-patch
            name: apply_patch
            arguments:
              patch_text: |
                *** Begin Patch
                *** Add File: added.txt
                +added by patch
                *** End Patch
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Added the requested file.
        - type: finish
          data:
            reason: stop
