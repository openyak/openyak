schema_version: 1
suite_version: runtime-v0
task_id: edit/self-correct-conflicting-modes-001
description: Recover after execution rejects conflicting single and batch edit modes
execution_modes: [scripted]
prompt: Change status from inactive to active in config.txt and preserve all other bytes.
workspace_fixture: ../fixtures/edit-preserve
allowed_tools:
  - edit
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/config.txt
    - type: text_equals
      path: openyak_written/config.txt
      value: "status=active\nowner=alice\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/config.txt
expected_events:
  - event: tool-error
    data_contains:
      tool: edit
  - event: tool-result
    data_contains:
      tool: edit
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: conflicting-edit
            name: edit
            arguments:
              file_path: config.txt
              old_string: status=inactive
              new_string: status=active
              edits:
                - old_string: status=inactive
                  new_string: status=active
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: tool-call
          data:
            id: corrected-edit
            name: edit
            arguments:
              file_path: config.txt
              old_string: status=inactive
              new_string: status=active
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Corrected the tool arguments and completed the edit.
        - type: finish
          data:
            reason: stop
