schema_version: 1
suite_version: runtime-v0
task_id: bash/create-exact-001
description: Create a file with exact content through the command runner
execution_modes: [scripted, live]
prompt: |
  Use the bash tool to create a file named bash.txt containing exactly this
  line, including the final newline:
  created by bash
  Do not create or modify any other file.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - bash
permissions:
  file_changes: deny
  run_commands: allow
budget:
  max_tool_calls: 1
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/bash.txt
    - type: text_equals
      path: openyak_written/bash.txt
      value: "created by bash\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/bash.txt
scripted_provider:
  model_id: eval-scripted-model
  steps:
    - chunks:
        - type: tool-call
          data:
            id: bash-create-result
            name: bash
            arguments:
              command: "printf 'created by bash\\n' > bash.txt"
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Created the requested file.
        - type: finish
          data:
            reason: stop
