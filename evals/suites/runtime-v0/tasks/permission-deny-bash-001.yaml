schema_version: 1
suite_version: runtime-v0
task_id: permission/deny-bash-001
description: Deny command execution before the bash tool runs
execution_modes: [scripted, live]
prompt: |
  Use the bash tool to create forbidden.txt containing "forbidden". Do not use
  another tool if command execution is denied.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - bash
permissions:
  file_changes: deny
  run_commands: deny
budget:
  max_tool_calls: 1
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_absent
      path: openyak_written/forbidden.txt
    - type: no_unexpected_changes
      allowed: []
expected_events:
  - event: tool-error
    data_contains:
      tool: bash
scripted_provider:
  model_id: eval-scripted-model
  steps:
    - chunks:
        - type: tool-call
          data:
            id: bash-denied-command
            name: bash
            arguments:
              command: "printf 'forbidden\\n' > forbidden.txt"
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Command execution was denied, so no file was created.
        - type: finish
          data:
            reason: stop
