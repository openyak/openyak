schema_version: 1
suite_version: runtime-v0
task_id: file/edit-preserve-001
description: Change one field without modifying unrelated content
execution_modes: [scripted, live]
prompt: Change status from inactive to active in config.txt. Preserve every other byte.
workspace_fixture: ../fixtures/edit-preserve
allowed_tools:
  - edit
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 30
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/config.txt
    - type: text_equals
      path: openyak_written/config.txt
      value: "status=active\nowner=alice\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/config.txt
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: edit-config
            name: edit
            arguments:
              file_path: config.txt
              old_string: status=inactive
              new_string: status=active
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Updated the requested field.
        - type: finish
          data:
            reason: stop
