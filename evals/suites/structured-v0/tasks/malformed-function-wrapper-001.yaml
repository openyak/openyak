schema_version: 1
suite_version: structured-v0
task_id: structured/malformed-function-wrapper-001
description: Repair a function/parameters object wrapper without a model retry
execution_modes: [scripted]
prompt: Create result.txt containing exactly "function" followed by a newline.
workspace_fixture: ../fixtures/empty
allowed_tools: [write]
permissions: {file_changes: allow, run_commands: deny}
budget: {max_tool_calls: 1, timeout_seconds: 30}
structured_generation:
  expected_tool: write
  coverage: [malformed_function_wrapper]
scorer:
  type: workspace
  assertions:
    - {type: text_equals, path: openyak_written/result.txt, value: "function\n"}
    - {type: no_unexpected_changes, allowed: [openyak_written/result.txt]}
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: function-wrapper
            name: ""
            arguments:
              function:
                name: write
                parameters: {file_path: result.txt, content: "function\n"}
        - {type: finish, data: {reason: tool_use}}
    - chunks:
        - {type: text-delta, data: {text: Created the file.}}
        - {type: finish, data: {reason: stop}}
