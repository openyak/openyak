schema_version: 1
suite_version: structured-v0
task_id: structured/nested-enum-invalid-001
description: Detect an invalid enum nested inside an executed tool call
execution_modes: [scripted]
prompt: |
  Track one pending task named "Measure structured generation" using the todo tool.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - todo
permissions:
  file_changes: deny
  run_commands: deny
budget:
  max_tool_calls: 1
  timeout_seconds: 30
structured_generation:
  expected_tool: todo
  coverage: [enum, nested]
scorer:
  type: workspace
  assertions:
    - type: no_unexpected_changes
      allowed: []
expected_events:
  - event: tool-result
    data_contains:
      tool: todo
scripted_provider:
  model_id: eval-scripted-model
  steps:
    - chunks:
        - type: tool-call
          data:
            id: invalid-nested-status
            name: todo
            arguments:
              todos:
                - content: Measure structured generation
                  status: queued
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Updated the task list.
        - type: finish
          data:
            reason: stop
