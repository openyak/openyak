schema_version: 1
suite_version: structured-v0
task_id: structured/semantic-path-recovery-001
description: Preserve a schema-valid but semantically wrong path after recovery
execution_modes: [scripted, live]
prompt: |
  Use write to create result.txt containing exactly "safe" followed by a newline.
  If a call fails, correct it using the execution feedback.
workspace_fixture: ../fixtures/empty
allowed_tools:
  - write
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 180
structured_generation:
  expected_tool: write
  coverage: [semantic]
  argument_assertions:
    - path: [file_path]
      equals: result.txt
      normalizer: workspace_output_path
scorer:
  type: workspace
  assertions:
    - type: file_exists
      path: openyak_written/result.txt
    - type: text_equals
      path: openyak_written/result.txt
      value: "safe\n"
    - type: no_unexpected_changes
      allowed:
        - openyak_written/result.txt
scripted_provider:
  model_id: eval-scripted-model
  steps:
    - chunks:
        - type: tool-call
          data:
            id: unsafe-semantic-path
            name: write
            arguments:
              file_path: ../../outside.txt
              content: "safe\n"
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: tool-call
          data:
            id: corrected-semantic-path
            name: write
            arguments:
              file_path: result.txt
              content: "safe\n"
        - type: finish
          data:
            reason: tool_use
    - chunks:
        - type: text-delta
          data:
            text: Corrected the path and created the requested file.
        - type: finish
          data:
            reason: stop
