schema_version: 1
suite_version: structured-v0
task_id: structured/unknown-tool-recovery-001
description: Reject an unknown tool and recover with the advertised tool
execution_modes: [scripted]
prompt: Use write to create result.txt containing exactly "known" followed by a newline.
workspace_fixture: ../fixtures/empty
allowed_tools: [write]
permissions:
  file_changes: allow
  run_commands: deny
budget:
  max_tool_calls: 2
  timeout_seconds: 30
structured_generation:
  expected_tool: write
  coverage: [unknown_tool]
scorer:
  type: workspace
  assertions:
    - type: text_equals
      path: openyak_written/result.txt
      value: "known\n"
    - type: no_unexpected_changes
      allowed: [openyak_written/result.txt]
scripted_provider:
  steps:
    - chunks:
        - type: tool-call
          data:
            id: unknown-tool
            name: create_file_magic
            arguments: {file_path: result.txt, content: "known\n"}
        - type: finish
          data: {reason: tool_use}
    - chunks:
        - type: tool-call
          data:
            id: corrected-known-tool
            name: write
            arguments: {file_path: result.txt, content: "known\n"}
        - type: finish
          data: {reason: tool_use}
    - chunks:
        - type: text-delta
          data: {text: Used the advertised tool.}
        - type: finish
          data: {reason: stop}
